<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Board Alt 1 – Neumorphic Tiles</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #e8eaf0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    padding: 24px;
  }

  .board {
    background: #e8eaf0;
    border-radius: 28px;
    padding: 28px 24px;
    width: 100%;
    max-width: 420px;
    box-shadow:
      8px 8px 20px #c8cad0,
      -8px -8px 20px #ffffff;
  }

  .board-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 24px;
  }

  .board-icon {
    width: 44px;
    height: 44px;
    background: linear-gradient(135deg, #f5a623, #e8870a);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    box-shadow:
      4px 4px 10px #c8cad0,
      -2px -2px 6px #ffffff,
      inset 0 1px 2px rgba(255,255,255,0.4);
  }

  .board-title {
    font-size: 20px;
    font-weight: 700;
    color: #2d3142;
    letter-spacing: -0.3px;
  }

  .board-subtitle {
    font-size: 13px;
    color: #8a8fa8;
    margin-top: 1px;
  }

  .xp-total-tile {
    background: linear-gradient(145deg, #f0a500, #d4870a);
    border-radius: 20px;
    padding: 20px 22px;
    margin-bottom: 24px;
    position: relative;
    overflow: hidden;
    box-shadow:
      6px 6px 16px #c8cad0,
      -3px -3px 10px #ffffff,
      inset 0 1px 3px rgba(255,255,255,0.35),
      inset 0 -2px 4px rgba(0,0,0,0.15);
  }

  .xp-total-tile::before {
    content: '';
    position: absolute;
    top: -20px; right: -20px;
    width: 100px; height: 100px;
    background: rgba(255,255,255,0.12);
    border-radius: 50%;
  }

  .xp-total-label {
    font-size: 13px;
    font-weight: 600;
    color: rgba(255,255,255,0.8);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .xp-total-value {
    font-size: 42px;
    font-weight: 800;
    color: #fff;
    line-height: 1.1;
    margin-top: 4px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.2);
  }

  .xp-total-badge {
    position: absolute;
    bottom: 16px; right: 18px;
    background: rgba(255,255,255,0.25);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 20px;
    letter-spacing: 0.5px;
  }

  .section-label {
    font-size: 12px;
    font-weight: 700;
    color: #8a8fa8;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    margin-bottom: 12px;
  }

  .rank-row {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #e8eaf0;
    border-radius: 16px;
    padding: 14px 16px;
    margin-bottom: 10px;
    box-shadow:
      4px 4px 10px #c8cad0,
      -3px -3px 8px #ffffff,
      inset 0 1px 1px rgba(255,255,255,0.6);
    transition: transform 0.15s;
    cursor: default;
  }

  .rank-row:hover {
    transform: translateY(-2px);
    box-shadow:
      6px 6px 14px #c8cad0,
      -4px -4px 10px #ffffff;
  }

  .rank-badge {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    font-weight: 800;
    flex-shrink: 0;
    box-shadow:
      3px 3px 8px #c8cad0,
      -2px -2px 5px #ffffff,
      inset 0 1px 2px rgba(255,255,255,0.5);
  }

  .rank-badge.gold   { background: linear-gradient(135deg,#ffe566,#f5a623); color: #7a4800; }
  .rank-badge.silver { background: linear-gradient(135deg,#e8e8e8,#b0b4c0); color: #4a4e5a; }
  .rank-badge.bronze { background: linear-gradient(135deg,#e8a878,#c07848); color: #5a2800; }
  .rank-badge.other  { background: linear-gradient(135deg,#d8dae0,#b8bcc8); color: #6a6e80; }

  .rank-avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: linear-gradient(135deg, #667eea, #764ba2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    flex-shrink: 0;
    box-shadow:
      3px 3px 8px #c8cad0,
      -2px -2px 5px #ffffff;
  }

  .rank-info { flex: 1; }

  .rank-name {
    font-size: 15px;
    font-weight: 700;
    color: #2d3142;
  }

  .rank-sport {
    font-size: 12px;
    color: #8a8fa8;
    margin-top: 1px;
  }

  .rank-xp {
    font-size: 17px;
    font-weight: 800;
    color: #f5a623;
    text-shadow: 0 1px 0 rgba(0,0,0,0.08);
  }

  .rank-xp span {
    font-size: 11px;
    font-weight: 600;
    color: #b0b4c0;
    margin-left: 2px;
  }

  /* me row */
  .rank-row.me {
    background: linear-gradient(145deg, #eef0f8, #e0e4f0);
    border: 1.5px solid rgba(102,126,234,0.2);
    box-shadow:
      4px 4px 10px #c8cad0,
      -3px -3px 8px #ffffff,
      inset 0 1px 2px rgba(255,255,255,0.8);
  }

  .rank-row.me .rank-name { color: #4a58d4; }

  .divider {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 6px 0;
    color: #b0b4c0;
    font-size: 18px;
    letter-spacing: 4px;
    padding-left: 52px;
  }
</style>
</head>
<body>
<div class="board">
  <div class="board-header">
    <div class="board-icon">🏆</div>
    <div>
      <div class="board-title">XP Leaderboard</div>
      <div class="board-subtitle">This Month · All Sports</div>
    </div>
  </div>

  <div class="xp-total-tile">
    <div class="xp-total-label">Your Total XP</div>
    <div class="xp-total-value">1,240</div>
    <div class="xp-total-badge">Foundation Phase</div>
  </div>

  <div class="section-label">Top Athletes</div>

  <div class="rank-row">
    <div class="rank-badge gold">1</div>
    <div class="rank-avatar">S</div>
    <div class="rank-info">
      <div class="rank-name">SwimBikeRun</div>
      <div class="rank-sport">Triathlon · İstanbul</div>
    </div>
    <div class="rank-xp">3,820 <span>XP</span></div>
  </div>

  <div class="rank-row">
    <div class="rank-badge silver">2</div>
    <div class="rank-avatar" style="background:linear-gradient(135deg,#11998e,#38ef7d)">M</div>
    <div class="rank-info">
      <div class="rank-name">MustafaY_96955</div>
      <div class="rank-sport">Tennis · Ankara</div>
    </div>
    <div class="rank-xp">2,150 <span>XP</span></div>
  </div>

  <div class="rank-row">
    <div class="rank-badge bronze">3</div>
    <div class="rank-avatar" style="background:linear-gradient(135deg,#f7971e,#ffd200)">A</div>
    <div class="rank-info">
      <div class="rank-name">Alp_Capa</div>
      <div class="rank-sport">Cycling · İzmir</div>
    </div>
    <div class="rank-xp">1,890 <span>XP</span></div>
  </div>

  <div class="rank-row">
    <div class="rank-badge other">4</div>
    <div class="rank-avatar" style="background:linear-gradient(135deg,#a18cd1,#fbc2eb)">D</div>
    <div class="rank-info">
      <div class="rank-name">DenizKaya</div>
      <div class="rank-sport">Swimming · İstanbul</div>
    </div>
    <div class="rank-xp">1,440 <span>XP</span></div>
  </div>

  <div class="divider">···</div>

  <div class="rank-row me">
    <div class="rank-badge other" style="background:linear-gradient(135deg,#667eea,#764ba2);color:#fff">12</div>
    <div class="rank-avatar" style="background:linear-gradient(135deg,#667eea,#764ba2)">Y</div>
    <div class="rank-info">
      <div class="rank-name">You</div>
      <div class="rank-sport">Running · Bursa</div>
    </div>
    <div class="rank-xp">1,240 <span>XP</span></div>
  </div>
</div>
</body>
</html>
